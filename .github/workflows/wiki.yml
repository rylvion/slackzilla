
name: Sync Documentation to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "assets/attachments/**"
      - "assets/docs/**"
      - "assets/devlogs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slackzilla-wiki-sync
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Wiki token
        env:
          WIKI_TOKEN: ${{ secrets.GH_SECRET_PAT }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Configure the WIKI_TOKEN repository secret."
            exit 1
          fi

      - name: Clone GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.GH_SECRET_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git" \
            wiki

      - name: Synchronise documentation
        run: |
          set -euo pipefail

          find wiki -mindepth 1 -maxdepth 1 \
            ! -name .git -exec rm -rf -- {} +

          cp -a docs/. wiki/
          cp README.md wiki/Home.md

          mkdir -p wiki/assets

          for directory in attachments docs devlogs; do
            if [ -d "assets/$directory" ]; then
              cp -a "assets/$directory" wiki/assets/
            fi
          done

          find wiki -type f -name '*.md' -print0 |
            xargs -0 -r sed -i \
              's#../assets/#assets/#g'

      - name: Commit and push Wiki changes
        run: |
          set -euo pipefail
          cd wiki

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync repository documentation"
          git push origin HEAD
