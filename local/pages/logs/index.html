<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slackzilla | Logs</title>
        <meta name="description" content="View logs for the Slackzilla bot">
        <link rel="stylesheet" href="../../css/dashboard.css">
    </head>
    <body class="app app--logs">
        <header>
            <span>SLACKZILLA</span>
            <div class="header-meta">static mirror of the live log view</div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div class="sidebar-title">NAVIGATION</div>
                <nav>
                    <a class="active" href="#">Logs</a>
                    <a href="../uptime/">Uptime</a>
                    <a href="../api/">API</a>
                    <a href="../docs/">Docs</a>
                    <a href="../admin/">Admin</a>
                </nav>

                <div class="sidebar-footer">
                    <div class="footer-title">STATUS</div>
                    <div class="status"><span class="dot"></span>online</div>
                </div>
            </aside>

            <main>
                <section class="panel panel--logs-header">
                    <h2>LOG STREAM</h2>
                    <div class="toolbar">
                        <input id="log-search" class="input" type="search" placeholder="Search logs" autocomplete="off">
                        <select id="log-level" class="input">
                            <option value="all">All levels</option>
                            <option value="info">Info</option>
                            <option value="success">Success</option>
                            <option value="warn">Warn</option>
                            <option value="error">Error</option>
                        </select>
                        <button class="button" id="log-clear" type="button">Clear</button>
                        <button class="button" id="log-copy" type="button">Copy</button>
                        <button class="button" id="log-download" type="button">Download</button>
                    </div>
                    <p class="note">ANSI colour codes are preserved so the terminal output looks like the running server.</p>
                </section>

                <section class="panel">
                    <div class="terminal" id="log-terminal" tabindex="0" aria-live="polite"></div>
                    <div class="line-muted" style="margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                        <span>local snapshot</span>
                        <span id="log-status">loading</span>
                    </div>
                </section>
            </main>
        </div>

        <script src="../../js/dashboard.js"></script>
    </body>
</html>
